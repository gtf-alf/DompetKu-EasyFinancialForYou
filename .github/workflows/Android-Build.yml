name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate missing Gradle Wrapper
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Siapkan Konfigurasi Google & Keystore
      run: |
        # Pastikan file google-services.json ada di folder app/
        if [ -f google-services.json ]; then
          cp google-services.json app/google-services.json
        fi
        
        # Salin keystore ke penamaan yang diminta
        if [ -f dompetku.keystore ]; then
          cp dompetku.keystore my-upload-key.jks
          cp dompetku.keystore app/my-upload-key.jks
        elif [ -f app/dompetku.keystore ]; then
          cp app/dompetku.keystore my-upload-key.jks
          cp app/dompetku.keystore app/my-upload-key.jks
        fi

        # Buat string resource default_web_client_id jika belum ada
        mkdir -p app/src/main/res/values
        if ! grep -q "default_web_client_id" app/src/main/res/values/strings.xml 2>/dev/null; then
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="default_web_client_id">dummy_web_client_id_placeholder</string></resources>' > app/src/main/res/values/strings_auth.xml
        fi

    - name: Build Release APK dengan Password Keystore
      run: ./gradlew assembleRelease -x lintVitalRelease -Pandroid.injected.signing.store.file=my-upload-key.jks -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=dompetku -Pandroid.injected.signing.key.password=android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DompetKu-APK
        path: app/build/outputs/apk/release/*.apk
