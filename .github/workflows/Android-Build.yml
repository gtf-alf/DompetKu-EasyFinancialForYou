name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate missing Gradle Wrapper
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create missing Keystore and Firebase dummy files
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        
        PKG_NAME="com.aistudio.dompetku.mrvqtz"
        
        echo '{"project_info":{"project_number":"123","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"'$PKG_NAME'"}},"oauth_client":[{"client_id":"dummy_client_id","client_type":3}],"api_key":[{"current_key":"dummy_api_key"}]}],"configuration_version":"1"}' > app/google-services.json
        
        mkdir -p app/src/main/res/values
        echo '<resources><string name="default_web_client_id">dummy_client_id</string></resources>' > app/src/main/res/values/strings_dummy.xml

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DompetKu-APK
        path: app/build/outputs/apk/debug/*.apk
