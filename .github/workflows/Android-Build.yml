name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate missing Gradle Wrapper
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Pastikan File Konfigurasi Terbaca
      run: |
        # Memastikan string resource untuk Google Sign-In terbaca dengan aman
        mkdir -p app/src/main/res/values
        if [ ! -f app/src/main/res/values/strings.xml ]; then
          echo '<resources><string name="default_web_client_id">dummy_client_id</string></resources>' > app/src/main/res/values/strings.xml
        fi

    - name: Build Release APK
      run: ./gradlew assembleRelease -x lintVitalRelease

    - name: Sign APK dengan Keystore Asli
      run: |
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
        $BUILD_TOOLS/apksigner sign --ks app/dompetku.keystore --ks-pass pass:android --ks-key-alias dompetku --key-pass pass:android $APK_PATH
        mv $APK_PATH app/build/outputs/apk/release/DompetKu-Ready.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DompetKu-APK
        path: app/build/outputs/apk/release/DompetKu-Ready.apk
